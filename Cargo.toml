[package]
name = "multi-db-schema-query"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
chrono-tz = "0.10.4"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.31"
rust_decimal = "1.39.0"
serde_json = "1.0.148"
sqlx = {version = "0.8.6", default-features = false, features = [
    "mysql",
    "runtime-tokio",
    "tls-native-tls",
    "macros",
    "chrono",
    "rust_decimal",
    "json"] }
tokio = { version = "1.48.0", features = [
    "macros",
    "rt",
    "net",
    "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
    "fmt",
    "chrono"] }
